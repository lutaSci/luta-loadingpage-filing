services:
  app:
    container_name: applanding
    build:
      context: .
      dockerfile: dockerfile
      args:
        VITE_LUTA_API_BASE: ${VITE_LUTA_API_BASE:-https://api.lutaai.com}
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:80"
