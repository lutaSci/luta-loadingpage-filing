map $args $luta_log_request {
    default 1;
    ~*(^|&)(state|legacy_slug|click_id)= 0;
}

map $args $luta_html_cache_control {
    default "no-cache";
    ~*(^|&)(state|legacy_slug|click_id)= "no-store, max-age=0";
}

server {
    listen 80;
    server_name _;

    # Signed state and legacy click identifiers are bearer capabilities. Keep
    # those query strings out of Nginx access logs while retaining normal
    # request logging for operational visibility.
    access_log /var/log/nginx/access.log combined if=$luta_log_request;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip for common text types
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;
    gzip_min_length 1024;

    # Container and reverse-proxy health probe. Public API calls go directly to
    # https://api.lutaai.com and therefore do not depend on this site's hosting.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Public TaBao shares use the brand domain while the API remains the only
    # renderer and data source. Keep this before the SPA fallback.
    location ^~ /share/tabao/ {
        proxy_ssl_server_name on;
        proxy_set_header Host api.lutaai.com;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass https://api.lutaai.com;
    }

    # Bounded compatibility route for Admin bundles cached before v1.0.4.
    # Remove after 2026-08-05 only after seven consecutive zero-hit days.
    # This must remain scoped to Admin auth/business paths; do not restore a
    # broad /api/ gateway on the public website.
    location ^~ /api/v1/admin/ {
        proxy_ssl_server_name on;
        proxy_ssl_name api.lutaai.com;
        proxy_set_header Host api.lutaai.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header X-Luta-Compatibility "admin-api-legacy" always;
        proxy_pass https://api.lutaai.com;
    }

    # Existing Smart Links keep /install as their immutable ingress. Never
    # cache its HTML response, even before React removes the bearer query.
    location = /install {
        add_header Cache-Control "no-store, max-age=0" always;
        try_files /index.html =404;
    }

    # Retired locale URLs remain reversible and preserve campaign parameters,
    # but cannot be cached or rediscovered as public language surfaces.
    location ~ ^/global/(en|ja|ko)/?$ {
        add_header Cache-Control "no-store, max-age=0" always;
        return 302 /$is_args$args;
    }

    # Active language routes use build-time rendered HTML so search and
    # social crawlers receive localized metadata without executing JavaScript.
    # Reuse the bearer-aware cache policy: Smart Link state can arrive on a
    # Marketing route before React removes it from the visible URL.
    location ~ ^/global/(zh-cn|zh-tw)/?$ {
        add_header Cache-Control $luta_html_cache_control always;
        try_files /global/$1.html =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache for static assets
    location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # No cache for HTML
    location = /index.html {
        add_header Cache-Control $luta_html_cache_control always;
    }
}
