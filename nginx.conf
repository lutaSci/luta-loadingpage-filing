server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip for common text types
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;
    gzip_min_length 1024;

    # Container and reverse-proxy health probe. Public API calls go directly to
    # https://api.lutaai.com and therefore do not depend on this site's hosting.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Public Tabao shares use the brand domain while the API remains the only
    # renderer and data source. Keep this before the SPA fallback.
    location ^~ /share/tabao/ {
        proxy_ssl_server_name on;
        proxy_set_header Host api.lutaai.com;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass https://api.lutaai.com;
    }

    # Bounded compatibility route for Admin bundles cached before v1.0.4.
    # Remove after 2026-08-05 only after seven consecutive zero-hit days.
    # This must remain scoped to Admin auth/business paths; do not restore a
    # broad /api/ gateway on the public website.
    location ^~ /api/v1/admin/ {
        proxy_ssl_server_name on;
        proxy_ssl_name api.lutaai.com;
        proxy_set_header Host api.lutaai.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header X-Luta-Compatibility "admin-api-legacy" always;
        proxy_pass https://api.lutaai.com;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache for static assets
    location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # No cache for HTML
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache";
    }
}
