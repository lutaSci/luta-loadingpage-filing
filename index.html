    <!-- Smart Link privacy guard. Analytics starts in React only after the
         bearer URL has been replaced with its safe canonical path. -->
    <script>
      const smartLinkParams = new URLSearchParams(window.location.search);
      const hasSmartLinkBearer = smartLinkParams.has('state')
        || smartLinkParams.has('legacy_slug')
        || smartLinkParams.has('click_id');
      let hasSmartLinkSession = false;
      try {
        hasSmartLinkSession = Boolean(
          window.sessionStorage.getItem('luta-smart-link-homepage-entry-v1')
        );
      } catch {
        hasSmartLinkSession = false;
      }
      const isSmartLinkJourney = window.location.pathname === '/install'
        || hasSmartLinkBearer
        || hasSmartLinkSession;

      if (isSmartLinkJourney) {
        const robots = document.createElement('meta');
        robots.name = 'robots';
        robots.content = 'noindex,nofollow';
        document.head.appendChild(robots);
      }

    </script>
