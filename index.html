    <!-- Google Analytics -->
    <script>
      // Smart Link journeys are measured by strict first-party allowlists.
      // Do not load GA before React removes bearer state from the visible URL:
      // enhanced measurement can observe History API changes and reconstruct it.
      const smartLinkParams = new URLSearchParams(window.location.search);
      const hasSmartLinkBearer = smartLinkParams.has('state')
        || smartLinkParams.has('legacy_slug')
        || smartLinkParams.has('click_id');
      let hasSmartLinkSession = false;
      try {
        hasSmartLinkSession = Boolean(
          window.sessionStorage.getItem('luta-smart-link-homepage-entry-v1')
        );
      } catch {
        hasSmartLinkSession = false;
      }
      const isSmartLinkJourney = window.location.pathname === '/install'
        || hasSmartLinkBearer
        || hasSmartLinkSession;

      if (isSmartLinkJourney) {
        const robots = document.createElement('meta');
        robots.name = 'robots';
        robots.content = 'noindex,nofollow';
        document.head.appendChild(robots);
      }

      if (!isSmartLinkJourney) {
        const gaScript = document.createElement('script');
        gaScript.async = true;
        gaScript.src = 'https://www.googletagmanager.com/gtag/js?id=G-5QE6T3L0LD';
        document.head.appendChild(gaScript);
        window.dataLayer = window.dataLayer || [];
        window.gtag = function(){window.dataLayer.push(arguments);};
        window.gtag('js', new Date());
        window.gtag('config', 'G-5QE6T3L0LD', {
          page_location: window.location.origin + window.location.pathname,
          page_path: window.location.pathname
        });
      }
