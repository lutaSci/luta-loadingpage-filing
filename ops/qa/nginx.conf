# No upstream API proxies in this web-only deployment. All API requests use
# the explicit QA origin in the bundle; reject unrelated compatibility paths.
log_format qa_path_only '$remote_addr $request_method $uri $status $body_bytes_sent';
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log qa_path_only;
    # Error diagnostics may include raw query strings; retain only fatal errors.
    error_log /var/log/nginx/error.log crit;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "connect-src 'self' https://qa-api.lutaai.com; form-action 'self'; base-uri 'self'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location ^~ /api/ { return 404; }
    location ^~ /share/ { return 404; }
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
    location = /install { try_files /index.html =404; }
    location ~ ^/global/(en|ja|ko)/?$ {
        absolute_redirect off;
        return 302 /$is_args$args;
    }
    location ~ ^/global/(zh-cn|zh-tw)/?$ { try_files /global/$1.html =404; }
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        try_files $uri =404;
    }
}
