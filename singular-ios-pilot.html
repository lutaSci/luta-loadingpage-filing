<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>汝塔 iOS 下載驗證</title>
  </head>
  <body>
    <main>
      <div class="eyebrow">LUTA · iOS 獨立測試入口</div>
      <h1>下載汝塔，<br />開始今日觀照</h1>
      <p>這個測試用於核對本次推廣帶來的安裝來源。選擇下方方式後，會前往 App Store。</p>
      <label class="choice">
        <input id="copy-consent" type="checkbox" />
        <span>複製本次推廣的安裝連接碼。App 首次開啟時可能詢問是否允許貼上；你可以拒絕，仍可正常使用。</span>
      </label>
      <button id="measured-download" type="button" disabled>複製連接碼並下載</button>
      <a class="store" href="https://apps.apple.com/us/app/id6778084383" rel="noreferrer">直接前往 App Store</a>
      <p id="status" role="status" aria-live="polite">測試入口尚未開放。你仍可直接從 App Store 下載。</p>
      <footer>此選擇不替代 App 內的廣告衡量與系統追蹤選擇。<br /><a href="https://lutaai.com/privacy" rel="noreferrer">隱私政策</a></footer>
    </main>
    <script type="module" src="/src/pilots/singular-ios/page.js"></script>
  </body>
</html>
